<VirtualHost *:80>
  ServerName azslive.ru
  ServerAlias www.azslive.ru benzin.idesighn.ru

  ProxyPreserveHost On
  ProxyPass / http://127.0.0.1:8011/
  ProxyPassReverse / http://127.0.0.1:8011/

  # allow user-uploaded photos up to ~10MB
  LimitRequestBody 10485760

  ErrorLog ${APACHE_LOG_DIR}/azslive-error.log
  CustomLog ${APACHE_LOG_DIR}/azslive-access.log combined
</VirtualHost>
